name: Backend CI (Tests & Quality Gate)

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"

jobs:
  backend-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Verify dependencies
        run: |
          cd backend
          go mod tidy
          git diff --exit-code

      - name: Go format check
        run: |
          cd backend
          test -z "$(gofmt -l .)"

      - name: Static analysis
        run: |
          cd backend
          go vet ./...

      - name: Run unit tests
        run: |
          cd backend
          go test ./...
