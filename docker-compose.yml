version: "3.9"

services:
  backend:
    build: ./backend
    container_name: gotradingg-backend
    ports:
      - "8080:8080"

  frontend:
    build: 
      context: ./frontend
      args:
        - VITE_API_BASE_URL=http://localhost:8080
    container_name: gotradingg-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
